name: Build Kivy APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev \
          libsqlite3-dev libssl-dev libffi-dev liblzma-dev uuid-dev

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade buildozer cython
        
    - name: Build with Buildozer
      run: |
        python3 - << 'EOF'
        import subprocess
        import sys
        import time

        # Menjalankan buildozer
        process = subprocess.Popen(
            ["buildozer", "-v", "android", "debug"],
            stdin=subprocess.PIPE,
            text=True
        )

        # Mengirim huruf 'y' secara otomatis secara berkala untuk melewati lisensi
        try:
            while process.poll() is None:
                try:
                    process.stdin.write("y\n")
                    process.stdin.flush()
                except (BrokenPipeError, IOError):
                    # Jika buildozer menutup jalur input (karena sudah selesai/tidak butuh), abaikan dengan aman
                    pass
                time.sleep(3)
        except Exception as e:
            print(f"Info: {e}")

        process.wait()
        sys.exit(process.returncode)
        EOF

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
